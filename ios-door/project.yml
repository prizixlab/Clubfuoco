name: FuocoDoor
options:
  bundleIdPrefix: com.clubfuoco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FuocoDoor:
    type: application
    platform: iOS
    sources:
      - FuocoDoor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubfuoco.door
        PRODUCT_NAME: Fuoco Door
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 4V87UVPTBW
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: FuocoDoor/Info.plist
      properties:
        CFBundleDisplayName: Fuoco Door
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        # Door staff scan guests at the venue — camera is the core surface.
        NSCameraUsageDescription: Fuoco Door uses the camera to scan guest entry QR codes at the door.
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
