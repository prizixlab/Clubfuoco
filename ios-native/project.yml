name: ClubFuoco
options:
  bundleIdPrefix: com.clubfuoco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
  Stripe:
    url: https://github.com/stripe/stripe-ios
    from: 23.18.0

targets:
  ClubFuoco:
    type: application
    platform: iOS
    sources:
      - ClubFuoco
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Stripe
        product: StripeApplePay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubfuoco.app
        PRODUCT_NAME: Club Fuoco
        # Follows the App Store's OWN numbering, which is 1.12 — not the
        # semantic 1.2.x this file used to carry. Apple compares each component
        # numerically, so 1.2.3 is LOWER than 1.12 and ASC rejects it. Anything
        # shipped from here must beat 1.12; the next one after this is 1.14.
        MARKETING_VERSION: "1.13"
        CURRENT_PROJECT_VERSION: "35"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 4V87UVPTBW
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: ClubFuoco/ClubFuoco.entitlements
    info:
      path: ClubFuoco/Info.plist
      properties:
        CFBundleDisplayName: Club Fuoco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Write-only Calendar access — used to add group nights to the user's calendar
        NSCalendarsWriteOnlyAccessUsageDescription: Add your group nights to your calendar so you don't miss them.
        # Attendance verification only — never continuous tracking.
        #   WhenInUse: single-shot read when the user taps "I'm here" or opens
        #     the active booking screen near arrival time.
        #   Always (optional, auto-upgrades after WhenInUse grant): registers a
        #     ~150m geofence around each upcoming venue for the booking night so
        #     iOS wakes the app and check-ins happen automatically. Users can
        #     downgrade to WhenInUse at any time in Settings → Location.
        NSLocationWhenInUseUsageDescription: See the clubs closest to you tonight, and confirm you arrived for a booking. Used only while the app is open — Club Fuoco does not track your location in the background.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allowing "Always" lets Club Fuoco check you in automatically when you arrive at a venue you booked. We only run a geofence around your booked venue on the night of the booking — no continuous tracking, ever.
        # Brand fonts (match the web app): Instrument Serif + Geist Sans/Mono
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-Bold.ttf
        GIDClientID: 170229454537-b4a62382bcnq7ugfckklvv75koih8heo.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.170229454537-b4a62382bcnq7ugfckklvv75koih8heo
          # Custom scheme for invite deep-links inside in-app browsers
          # (Instagram/TikTok/etc don't honor Universal Links).
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.clubfuoco.app.invite
            CFBundleURLSchemes:
              - clubfuoco

schemes:
  ClubFuoco:
    build:
      targets:
        ClubFuoco: all
    run:
      config: Debug
    archive:
      config: Release
