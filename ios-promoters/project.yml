name: FuocoPromoters
options:
  bundleIdPrefix: com.clubfuoco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  FuocoPromoters:
    type: application
    platform: iOS
    sources:
      - FuocoPromoters
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubfuoco.promoters
        PRODUCT_NAME: Fuoco For Promoters
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 4V87UVPTBW
        # Push (aps-environment) entitlement is staged but NOT wired yet: the
        # com.clubfuoco.promoters App ID doesn't have the Push Notifications
        # capability and no signed-in account is available to xcodebuild to add
        # it. Once the capability is enabled (Xcode > Signing & Capabilities
        # with an Apple ID signed in, or developer.apple.com), uncomment:
        # CODE_SIGN_ENTITLEMENTS: FuocoPromoters/FuocoPromoters.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: FuocoPromoters/Info.plist
      properties:
        CFBundleDisplayName: Fuoco For Promoters
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
